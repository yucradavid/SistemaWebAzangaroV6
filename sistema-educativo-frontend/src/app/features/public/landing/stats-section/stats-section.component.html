<section class="py-16 bg-cermat-blue-700">
  <div class="max-w-7xl mx-auto px-6">

    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center bg-white shadow-lg rounded-2xl py-6 my-8 border border-gray-100">

      <div class="px-4 py-4" appScrollReveal="fadeUp" [delay]="0">
        <div class="text-[clamp(2.25rem,5vw,3.5rem)] font-black text-editorial-navy leading-none tracking-tight">
          {{ schoolInfo().students }}+
        </div>
        <div class="mt-3 text-xs font-semibold uppercase tracking-[0.2em] text-editorial-muted">Estudiantes</div>
      </div>

      <div class="px-4 py-4" appScrollReveal="fadeUp" [delay]="100">
        <div class="text-[clamp(2.25rem,5vw,3.5rem)] font-black text-editorial-navy leading-none tracking-tight">
          {{ schoolInfo().teachers }}
        </div>
        <div class="mt-3 text-xs font-semibold uppercase tracking-[0.2em] text-editorial-muted">Docentes</div>
      </div>

      <div class="px-4 py-4" appScrollReveal="fadeUp" [delay]="200">
        <div class="text-[clamp(2.25rem,5vw,3.5rem)] font-black text-editorial-navy leading-none tracking-tight">
          {{ yearsOfExperience() }}
        </div>
        <div class="mt-3 text-xs font-semibold uppercase tracking-[0.2em] text-editorial-muted">Años</div>
      </div>

      <div class="px-4 py-4" appScrollReveal="fadeUp" [delay]="300">
        <div class="text-[clamp(2.25rem,5vw,3.5rem)] font-black text-editorial-gold leading-none tracking-tight">
          {{ schoolInfo().satisfaction }}%
        </div>
        <div class="mt-3 text-xs font-semibold uppercase tracking-[0.2em] text-editorial-muted">Satisfacción</div>
      </div>

    </div>

  </div>
</section>
