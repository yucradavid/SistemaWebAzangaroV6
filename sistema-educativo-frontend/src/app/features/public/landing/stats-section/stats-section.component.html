<section class="py-20 bg-editorial-cream border-y border-editorial-border">
  <div class="container-editorial">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-0 divide-x divide-editorial-border">

      <div class="px-8 py-6 text-center" appScrollReveal="fadeUp" [delay]="0">
        <div class="text-[clamp(2.5rem,5vw,4rem)] font-black text-editorial-navy leading-none tracking-tight">
          {{ schoolInfo().students }}+
        </div>
        <div class="label-editorial mt-3 text-editorial-muted">Estudiantes</div>
      </div>

      <div class="px-8 py-6 text-center" appScrollReveal="fadeUp" [delay]="100">
        <div class="text-[clamp(2.5rem,5vw,4rem)] font-black text-editorial-navy leading-none tracking-tight">
          {{ schoolInfo().teachers }}
        </div>
        <div class="label-editorial mt-3 text-editorial-muted">Docentes</div>
      </div>

      <div class="px-8 py-6 text-center" appScrollReveal="fadeUp" [delay]="200">
        <div class="text-[clamp(2.5rem,5vw,4rem)] font-black text-editorial-navy leading-none tracking-tight">
          {{ yearsOfExperience() }}
        </div>
        <div class="label-editorial mt-3 text-editorial-muted">Años</div>
      </div>

      <div class="px-8 py-6 text-center" appScrollReveal="fadeUp" [delay]="300">
        <div class="text-[clamp(2.5rem,5vw,4rem)] font-black text-editorial-gold leading-none tracking-tight">
          {{ schoolInfo().satisfaction }}%
        </div>
        <div class="label-editorial mt-3 text-editorial-muted">Satisfacción</div>
      </div>

    </div>
  </div>
</section>
