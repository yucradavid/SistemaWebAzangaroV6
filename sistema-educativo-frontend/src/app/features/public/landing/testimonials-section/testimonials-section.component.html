<section class="py-24 lg:py-32 bg-white">
  <div class="container-editorial">

    <!-- Header -->
    <div class="mb-16 text-center" appScrollReveal="fadeUp">
      <p class="label-editorial mb-4">Testimonios</p>
      <div class="section-divider mx-auto mb-6"></div>
      <h2 class="text-[clamp(2rem,5vw,3.5rem)] font-black text-editorial-navy leading-[0.95] tracking-tight">
        La voz de nuestra<br/>
        <span class="text-editorial-gold">Familia</span>
      </h2>
    </div>

    <!-- Carousel -->
    <div class="max-w-3xl mx-auto" appScrollReveal="fadeUp" [delay]="200">
      <p-carousel
        [value]="testimonials()"
        [numVisible]="1"
        [numScroll]="1"
        [autoplayInterval]="6000"
        [circular]="true"
        [showNavigators]="true"
        [showIndicators]="true"
        [responsiveOptions]="responsiveOptions"
        aria-label="Testimonios de padres de familia y exalumnos">

        <ng-template pTemplate="item" let-testimonial>
          <div class="px-4">
            <div class="text-center py-8">

              <!-- Rating -->
              <div class="flex justify-center gap-1 mb-8" role="img" [attr.aria-label]="'Calificación: ' + testimonial.rating + ' de 5'">
                <svg *ngFor="let star of [1,2,3,4,5]"
                     class="w-4 h-4" [class.text-editorial-gold]="star <= testimonial.rating" [class.text-editorial-border]="star > testimonial.rating"
                     fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
              </div>

              <!-- Cita -->
              <blockquote class="text-xl md:text-2xl text-editorial-navy font-medium leading-relaxed mb-8 italic">
                "{{ testimonial.text }}"
              </blockquote>

              <!-- Separador -->
              <div class="section-divider mx-auto mb-6"></div>

              <!-- Autor -->
              <div class="flex items-center justify-center gap-4">
                <img [src]="testimonial.image"
                     [alt]="testimonial.name" loading="lazy" decoding="async" width="48" height="48"
                     class="w-12 h-12 rounded-full object-cover" />
                <div class="text-left">
                  <div class="font-bold text-editorial-navy text-sm">{{ testimonial.name }}</div>
                  <div class="text-xs text-editorial-muted">{{ testimonial.role }} &mdash; {{ testimonial.level }}</div>
                </div>
              </div>

            </div>
          </div>
        </ng-template>

      </p-carousel>
    </div>
  </div>
</section>
