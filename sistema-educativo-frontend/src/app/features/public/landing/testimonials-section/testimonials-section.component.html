<section class="py-24 lg:py-14 lg:h-full lg:flex lg:flex-col lg:justify-center bg-white overflow-hidden">
  <div class="container-editorial">

    <!-- Header -->
    <header class="mb-14 text-center" appRevealGroup="fadeUp" [stagger]="0.12">
      <p class="label-editorial mb-4">Testimonios</p>
      <h2 class="text-[clamp(2rem,5vw,3.5rem)] font-black text-editorial-navy leading-[0.95] tracking-tight">
        La voz de nuestra<br/>
        <span class="text-editorial-gold">Familia</span>
      </h2>
    </header>
  </div>

  <!-- Fila 1: hacia la izquierda -->
  <div class="marquee mb-6"
       [style.--marquee-duration]="'70s'"
       [style.--marquee-gap]="'1.5rem'"
       aria-hidden="false">
    <div class="marquee-track marquee-left">
      <div class="marquee-group">
        <figure *ngFor="let t of rowA; trackBy: trackByIndex"
                class="testimonial-card group w-[320px] sm:w-[400px] shrink-0 bg-white border-l-4 border-editorial-gold p-7 shadow-sm hover:shadow-xl transition-shadow duration-500">
          <div class="flex items-start justify-between gap-4 mb-4">
            <span class="font-serif text-6xl leading-none text-editorial-gold/30 select-none" aria-hidden="true">&ldquo;</span>
            <div class="flex gap-0.5 pt-2" role="img" [attr.aria-label]="'Calificación: ' + t.rating + ' de 5'">
              <svg *ngFor="let star of [1,2,3,4,5]"
                   class="w-3.5 h-3.5" [class.text-editorial-gold]="star <= t.rating" [class.text-editorial-border]="star > t.rating"
                   fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            </div>
          </div>

          <blockquote class="text-[15px] text-editorial-navy leading-relaxed line-clamp-4 min-h-[5.5rem]">
            {{ t.text }}
          </blockquote>

          <figcaption class="mt-6 flex items-center gap-3 border-t border-editorial-border pt-5">
            <img [src]="t.image" [alt]="t.name" loading="lazy" decoding="async" width="44" height="44"
                 class="w-11 h-11 rounded-full object-cover grayscale-[25%]" />
            <div>
              <div class="text-sm font-bold text-editorial-navy">{{ t.name }}</div>
              <div class="text-xs text-editorial-muted">{{ t.role }} &mdash; {{ t.level }}</div>
            </div>
          </figcaption>
        </figure>
      </div>
      <div class="marquee-group" aria-hidden="true">
        <figure *ngFor="let t of rowA; trackBy: trackByIndex"
                class="testimonial-card w-[320px] sm:w-[400px] shrink-0 bg-white border-l-4 border-editorial-gold p-7 shadow-sm pointer-events-none">
          <div class="flex items-start justify-between gap-4 mb-4">
            <span class="font-serif text-6xl leading-none text-editorial-gold/30 select-none">&ldquo;</span>
            <div class="flex gap-0.5 pt-2">
              <svg *ngFor="let star of [1,2,3,4,5]"
                   class="w-3.5 h-3.5" [class.text-editorial-gold]="star <= t.rating" [class.text-editorial-border]="star > t.rating"
                   fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            </div>
          </div>

          <blockquote class="text-[15px] text-editorial-navy leading-relaxed line-clamp-4 min-h-[5.5rem]">
            {{ t.text }}
          </blockquote>

          <figcaption class="mt-6 flex items-center gap-3 border-t border-editorial-border pt-5">
            <img [src]="t.image" alt="" loading="lazy" decoding="async" width="44" height="44"
                 class="w-11 h-11 rounded-full object-cover grayscale-[25%]" />
            <div>
              <div class="text-sm font-bold text-editorial-navy">{{ t.name }}</div>
              <div class="text-xs text-editorial-muted">{{ t.role }} &mdash; {{ t.level }}</div>
            </div>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>

  <!-- Fila 2: hacia la derecha, variante crema -->
  <div class="marquee"
       [style.--marquee-duration]="'85s'"
       [style.--marquee-gap]="'1.5rem'">

            <span class="font-serif text-6xl leading-none text-editorial-navy/15 select-none" aria-hidden="true">&ldquo;</span>
            <div class="flex gap-0.5 pt-2" role="img" [attr.aria-label]="'Calificación: ' + t.rating + ' de 5'">
              <svg *ngFor="let star of [1,2,3,4,5]"
                   class="w-3.5 h-3.5" [class.text-editorial-gold]="star <= t.rating" [class.text-editorial-border]="star > t.rating"
                   fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            </div>
          </div>

          <blockquote class="text-[15px] text-editorial-navy leading-relaxed line-clamp-4 min-h-[5.5rem]">
            {{ t.text }}
          </blockquote>

          <figcaption class="mt-6 flex items-center gap-3 border-t border-editorial-border pt-5">
            <img [src]="t.image" [alt]="t.name" loading="lazy" decoding="async" width="44" height="44"
                 class="w-11 h-11 rounded-full object-cover grayscale-[25%]" />
            <div>
              <div class="text-sm font-bold text-editorial-navy">{{ t.name }}</div>
              <div class="text-xs text-editorial-muted">{{ t.role }} &mdash; {{ t.level }}</div>
            </div>
          </figcaption>
        </figure>
      </div>
      <div class="marquee-group" aria-hidden="true">
        <figure *ngFor="let t of rowB; trackBy: trackByIndex"
                class="testimonial-card w-[320px] sm:w-[400px] shrink-0 bg-editorial-cream border-l-4 border-editorial-navy p-7 pointer-events-none">
          <div class="flex items-start justify-between gap-4 mb-4">
            <span class="font-serif text-6xl leading-none text-editorial-navy/15 select-none">&ldquo;</span>
            <div class="flex gap-0.5 pt-2">
              <svg *ngFor="let star of [1,2,3,4,5]"
                   class="w-3.5 h-3.5" [class.text-editorial-gold]="star <= t.rating" [class.text-editorial-border]="star > t.rating"
                   fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            </div>
          </div>

          <blockquote class="text-[15px] text-editorial-navy leading-relaxed line-clamp-4 min-h-[5.5rem]">
            {{ t.text }}
          </blockquote>

          <figcaption class="mt-6 flex items-center gap-3 border-t border-editorial-border pt-5">
            <img [src]="t.image" alt="" loading="lazy" decoding="async" width="44" height="44"
                 class="w-11 h-11 rounded-full object-cover grayscale-[25%]" />
            <div>
              <div class="text-sm font-bold text-editorial-navy">{{ t.name }}</div>
              <div class="text-xs text-editorial-muted">{{ t.role }} &mdash; {{ t.level }}</div>
            </div>
          </figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>
