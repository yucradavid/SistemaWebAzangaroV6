<section class="py-16 lg:py-20 bg-white">
  <div class="max-w-7xl mx-auto px-6">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end md:justify-between mb-12" appScrollReveal="fadeUp">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-editorial-gold mb-4">Actualidad</p>
        <div class="h-1 w-16 bg-editorial-gold mb-6"></div>
        <h2 class="text-[clamp(2rem,5vw,3.5rem)] font-black text-editorial-navy leading-[0.95] tracking-tight">
          Noticias y<br/>
          <span class="text-editorial-gold">Eventos</span>
        </h2>
      </div>
      <a routerLink="/noticias"
         class="hidden md:inline-flex items-center gap-2 text-sm font-semibold text-editorial-navy uppercase tracking-[0.1em] hover:text-editorial-gold transition-colors mt-6 md:mt-0">
        Ver todas
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </a>
    </div>

    <!-- Grid de noticias -->
    <div class="grid lg:grid-cols-3 gap-8">
      <article *ngFor="let item of featuredNews(); let i = index"
               class="group"
               role="article"
               appScrollReveal="fadeUp"
               [delay]="i * 150">

        <!-- Imagen -->
        <div class="aspect-[4/3] overflow-hidden mb-6">
          <img [src]="item.image" [alt]="item.title" loading="lazy" decoding="async"
               class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
        </div>

        <!-- Meta -->
        <div class="flex items-center gap-3 mb-3">
          <span class="text-xs font-semibold uppercase tracking-[0.2em] text-editorial-gold">{{ item.category }}</span>
          <span class="text-editorial-border">|</span>
          <time class="text-xs text-editorial-muted">{{ formatDate(item.date) }}</time>
        </div>

        <!-- Título -->
        <h3 class="text-xl font-bold text-editorial-navy leading-snug mb-3 group-hover:text-editorial-gold transition-colors">
          {{ item.title }}
        </h3>

        <!-- Extracto -->
        <p class="text-sm text-editorial-muted leading-relaxed mb-4 line-clamp-2">
          {{ item.excerpt }}
        </p>

        <!-- Link -->
        <a [routerLink]="['/noticias', item.slug]"
           class="inline-flex items-center gap-2 text-xs font-semibold text-editorial-navy uppercase tracking-[0.1em] hover:text-editorial-gold transition-colors">
          Leer más
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
        </a>
      </article>
    </div>

    <!-- Mobile link -->
    <div class="text-center md:hidden mt-12">
      <a routerLink="/noticias" class="inline-flex items-center justify-center px-6 py-3 bg-cermat-blue-600 text-white font-semibold rounded-xl hover:bg-cermat-blue-700 transition-colors">
        Ver todas las noticias
      </a>
    </div>

  </div>
</section>
