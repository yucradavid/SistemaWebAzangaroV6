<header class="fixed top-6 left-0 right-0 z-50 px-4 transition-all duration-500">
  <!-- Desktop: pill layout -->
  <div class="hidden lg:flex justify-center">
    <div class="bg-blue-950/90 backdrop-blur-xl border border-white/10 rounded-full px-2 py-2 flex items-center justify-between gap-2 max-w-5xl w-full transition-all duration-300 hover:bg-blue-950/95"
         [ngClass]="isScrolled() ? 'scale-100 shadow-2xl shadow-blue-950/40 py-1.5' : 'scale-[1.02] shadow-xl shadow-blue-900/20'">

      <a routerLink="/" class="flex-shrink-0 group" aria-label="CERMAT - Ir al inicio">
        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center transition-transform transform group-hover:rotate-12 group-hover:scale-105 border-2 border-transparent group-hover:border-yellow-400">
          <svg aria-hidden="true" class="w-6 h-6 text-blue-950" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
        </div>
      </a>

      <nav class="flex items-center gap-1" role="navigation" aria-label="Menú principal">
        <a *ngFor="let item of menuItems"
           [routerLink]="item.route"
           routerLinkActive="bg-white/10 text-white font-semibold"
           [routerLinkActiveOptions]="{exact: item.route === '/'}"
           class="px-5 py-2.5 rounded-full text-sm text-gray-300 hover:text-white hover:bg-white/5 transition-all duration-300 font-medium tracking-wide focus-ring">
           {{ item.label }}
        </a>
      </nav>

      <button routerLink="/login" class="px-6 py-2.5 bg-white text-blue-950 rounded-full font-bold text-sm hover:bg-yellow-400 hover:text-blue-950 transition-colors shadow-lg shadow-white/10 flex items-center gap-2 focus-ring">
        <svg aria-hidden="true" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
        <span>Portal</span>
      </button>

    </div>
  </div>

  <!-- Mobile: separate floating icons -->
  <div class="lg:hidden flex justify-between items-center">
    <a routerLink="/" class="w-11 h-11 bg-blue-950/90 backdrop-blur-xl border border-white/10 rounded-full flex items-center justify-center shadow-lg hover:bg-blue-950 transition-colors"
       aria-label="CERMAT - Ir al inicio">
      <svg aria-hidden="true" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
      </svg>
    </a>

    <button (click)="toggleMobileMenu()"
            aria-label="Menu de navegacion"
            [attr.aria-expanded]="isMobileMenuOpen()"
            class="w-11 h-11 bg-blue-950/90 backdrop-blur-xl border border-white/10 rounded-full flex items-center justify-center text-white shadow-lg hover:bg-blue-950 transition-colors">
       <div aria-hidden="true" class="w-5 h-5 flex flex-col justify-center gap-1.5">
          <span class="w-full h-0.5 bg-current rounded-full transition-all" [ngClass]="{'rotate-45 translate-y-2': isMobileMenuOpen()}"></span>
          <span class="w-full h-0.5 bg-current rounded-full transition-all" [ngClass]="{'opacity-0': isMobileMenuOpen()}"></span>
          <span class="w-full h-0.5 bg-current rounded-full transition-all" [ngClass]="{'-rotate-45 -translate-y-2': isMobileMenuOpen()}"></span>
       </div>
    </button>
  </div>

</header>

<p-sidebar
  [(visible)]="isMobileMenuOpen"
  position="top"
  [modal]="true"
  [showCloseIcon]="false"
  [dismissible]="true"
  [closeOnEscape]="true"
  styleClass="header-mobile-sidebar"
  [style]="{ height: 'auto', maxHeight: '80vh', top: '76px', borderRadius: '0 0 24px 24px', margin: '0 16px', width: 'calc(100% - 32px)', background: 'rgba(15, 23, 42, 0.95)', backdropFilter: 'blur(24px)', border: '1px solid rgba(255,255,255,0.1)' }"
  (onHide)="closeMobileMenu()">

  <ng-template pTemplate="headless">
    <div class="flex flex-col gap-2 p-4">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         (click)="closeMobileMenu()"
         routerLinkActive="bg-white text-blue-950 font-bold"
         [routerLinkActiveOptions]="{exact: item.route === '/'}"
         class="px-6 py-4 rounded-2xl text-gray-300 hover:bg-white/10 hover:text-white transition-all text-center text-lg font-medium">
         {{ item.label }}
      </a>

      <div class="h-px w-full bg-white/10 my-2"></div>

      <button routerLink="/login" (click)="closeMobileMenu()" class="w-full px-6 py-4 bg-yellow-400 text-blue-950 rounded-2xl font-bold hover:bg-yellow-300 transition-colors flex items-center justify-center gap-2 text-lg">
        <svg aria-hidden="true" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
        Ingresar a Portal
      </button>
    </div>
  </ng-template>

</p-sidebar>
