<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500"
        [ngClass]="isScrolled() ? 'bg-editorial-navy/95 backdrop-blur-md shadow-lg' : 'bg-transparent'">
  <!-- Desktop -->
  <div class="hidden lg:block">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-20">

      <a routerLink="/" class="flex items-center gap-3 group" aria-label="CERMAT - Ir al inicio">
        <div class="w-10 h-10 bg-cermat-red-600 flex items-center justify-center transition-transform group-hover:scale-105">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
        </div>
        <div>
          <span class="text-white font-bold text-sm tracking-wide">CERMAT</span>
          <span class="block text-[10px] text-editorial-muted tracking-[0.2em] uppercase">School</span>
        </div>
      </a>

      <nav class="flex items-center gap-8" role="navigation" aria-label="Menú principal">
        <a *ngFor="let item of menuItems"
           [routerLink]="item.route"
           routerLinkActive="text-cermat-red-400"
           [routerLinkActiveOptions]="{exact: item.route === '/'}"
           class="text-sm text-gray-400 hover:text-white transition-colors font-medium tracking-wide focus-ring">
           {{ item.label }}
        </a>
      </nav>

      <button routerLink="/login"
              class="px-6 py-2.5 bg-cermat-red-600 text-white text-sm font-semibold hover:bg-cermat-red-700 transition-colors focus-ring">
        Portal
      </button>

    </div>
  </div>

  <!-- Mobile -->
  <div class="lg:hidden flex justify-between items-center px-6 h-16">
    <a routerLink="/" class="flex items-center gap-2 group" aria-label="CERMAT - Ir al inicio">
      <div class="w-9 h-9 bg-cermat-red-600 flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
        </svg>
      </div>
      <span class="text-white font-bold text-sm">CERMAT</span>
    </a>

    <button (click)="toggleMobileMenu()"
            aria-label="Menu de navegacion"
            [attr.aria-expanded]="isMobileMenuOpen()"
            class="w-9 h-9 flex flex-col items-center justify-center gap-1.5 text-white focus-ring">
      <span class="w-5 h-px bg-current rounded-full transition-all" [ngClass]="{'rotate-45 translate-y-[3px]': isMobileMenuOpen()}"></span>
      <span class="w-5 h-px bg-current rounded-full transition-all" [ngClass]="{'opacity-0': isMobileMenuOpen()}"></span>
      <span class="w-5 h-px bg-current rounded-full transition-all" [ngClass]="{'-rotate-45 -translate-y-[3px]': isMobileMenuOpen()}"></span>
    </button>
  </div>
</header>

<p-sidebar
  [(visible)]="isMobileMenuOpen"
  position="top"
  [modal]="true"
  [showCloseIcon]="false"
  [dismissible]="true"
  [closeOnEscape]="true"
  styleClass="header-mobile-sidebar"
  [style]="{ height: 'auto', maxHeight: '80vh', top: '64px', borderRadius: '0', margin: '0', width: '100%', background: 'rgba(10, 25, 41, 0.98)', backdropFilter: 'blur(24px)', border: 'none', borderBottom: '1px solid rgba(255,255,255,0.05)' }"
  (onHide)="closeMobileMenu()">

  <ng-template pTemplate="headless">
    <div class="flex flex-col gap-1 p-6">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.route"
         (click)="closeMobileMenu()"
         routerLinkActive="text-cermat-red-400 font-semibold"
         [routerLinkActiveOptions]="{exact: item.route === '/'}"
         class="px-4 py-3 text-gray-400 hover:text-white transition-colors text-base font-medium">
         {{ item.label }}
      </a>

      <div class="h-px w-full bg-white/5 my-3"></div>

      <button routerLink="/login" (click)="closeMobileMenu()"
              class="w-full px-4 py-3 border border-cermat-red-500 text-cermat-red-400 font-semibold hover:bg-cermat-red-600 hover:text-white transition-colors text-base focus-ring">
        Ingresar a Portal
      </button>
    </div>
  </ng-template>

</p-sidebar>
