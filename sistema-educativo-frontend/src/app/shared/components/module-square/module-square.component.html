<a
  [routerLink]="path || null"
  [ngStyle]="customStyle"
  [ngClass]="[
    'group cursor-pointer relative flex flex-col items-center justify-center p-8 h-64 w-full',
    'bg-slate-900/80 backdrop-blur-md border border-white/10 rounded-xl',
    'hover:bg-blue-900/90 hover:scale-[1.02] hover:border-blue-400/50',
    'transition-all duration-300 shadow-xl overflow-hidden',
    customClass
  ]"
>
  <!-- Orb effect -->
  <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none group-hover:bg-blue-400/20 transition-colors"></div>

  <!-- Content -->
  <div class="flex flex-col items-center text-center z-10 space-y-6 w-full">
    <!-- Icon Container -->
    <div class="p-4 rounded-2xl border-2 border-white/20 group-hover:border-blue-400/80 bg-transparent transition-colors duration-300 text-white">
      <ng-container *ngIf="isSvgIcon; else lucideIcon">
        <div class="w-[3.5rem] h-[3.5rem] mx-auto" [innerHTML]="safeIcon"></div>
      </ng-container>
      <ng-template #lucideIcon>
        <i [attr.data-lucide]="icon" class="w-[3.5rem] h-[3.5rem] text-white/90 group-hover:text-blue-100 stroke-[1.3] transition-colors duration-300"></i>
      </ng-template>
    </div>

    <!-- Texts -->
    <div class="space-y-1 w-full">
      <h3 class="text-[0.95rem] font-bold text-white tracking-widest uppercase group-hover:text-blue-100 transition-colors leading-tight text-center">
        {{ title }}
      </h3>

      <!-- Description -->
      <p class="text-[0.65rem] text-slate-300/80 uppercase tracking-wider font-medium max-w-[200px] text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 absolute bottom-4 left-0 right-0 mx-auto">
        {{ description }}
      </p>
    </div>
  </div>
</a>
