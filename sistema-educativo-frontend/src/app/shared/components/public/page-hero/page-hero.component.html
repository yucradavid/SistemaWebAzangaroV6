<header class="relative overflow-hidden bg-editorial-navy text-white">
  <!-- Textura de puntos muy sutil, coherente con el landing -->
  <div class="hero-dots absolute inset-0" aria-hidden="true"></div>
  <div class="hero-glow absolute -top-40 right-[-10%] h-[28rem] w-[28rem] rounded-full" aria-hidden="true"></div>

  <div class="container-editorial relative z-10 pt-16 pb-14 sm:pt-20 sm:pb-16 lg:pt-24 lg:pb-20">
    <!-- Breadcrumb -->
    <nav aria-label="Miga de pan" class="mb-8 flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.18em]">
      <a routerLink="/" class="text-editorial-muted transition-colors hover:text-editorial-gold-light">Inicio</a>
      <lucide-icon [img]="ChevronRight" class="h-3 w-3 text-editorial-muted" aria-hidden="true" />
      <span class="text-editorial-gold-light">{{ crumb() || title() }}</span>
    </nav>

    <p class="label-editorial mb-4 !text-editorial-gold-light">{{ label() }}</p>
    <h1 class="max-w-3xl font-display text-4xl font-bold leading-[1.05] tracking-tight sm:text-5xl lg:text-6xl">
      {{ title() }}
    </h1>

    @if (subtitle()) {
      <p class="mt-6 max-w-2xl text-lg leading-relaxed text-white/75 sm:text-xl">
        {{ subtitle() }}
      </p>
    }

    <div class="section-divider mt-10"></div>
  </div>
</header>
